<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz - DOM Autopilot Test</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .quiz-card {
            background: #1e293b;
            padding: 32px;
            border-radius: 14px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        .header {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.5;
            color: #ffffff;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }
        .option-label:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }
        .option-label input[type="radio"] {
            margin-right: 14px;
            transform: scale(1.3);
            accent-color: #38bdf8;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 18px;
        }
        .btn-next {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-next:hover {
            background: #0369a1;
        }
        .score-info {
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="header" id="q-counter">Question 1 of 5</div>
        <div class="question-text" id="q-text">Loading question...</div>

        <form class="options-list" id="options-container">
            <!-- Options dynamically injected -->
        </form>

        <div class="footer">
            <span class="score-info" id="status-msg">Select an option</span>
            <div style="display:flex; gap:10px;">
                <button class="btn-next" style="background:#475569;" onclick="toggleFullscreen()">Toggle Fullscreen</button>
                <button class="btn-next" id="next-btn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        const questions = [
            {
                q: "Which protocol is primarily used for securely transferring web pages over the internet?",
                options: ["FTP", "HTTPS", "SMTP", "Telnet"],
                answer: 1
            },
            {
                q: "What is the primary function of RAM in a computer system?",
                options: ["Long term storage", "Temporary high-speed memory for active tasks", "Power regulation", "Cooling processor"],
                answer: 1
            },
            {
                q: "What is the capital of Japan?",
                options: ["Seoul", "Kyoto", "Tokyo", "Osaka"],
                answer: 2
            },
            {
                q: "In Python, which built-in function returns the number of items in a list?",
                options: ["size()", "count()", "len()", "length()"],
                answer: 2
            },
            {
                q: "Which planet in our solar system has the highest number of moons?",
                options: ["Mars", "Saturn", "Jupiter", "Neptune"],
                answer: 1
            }
        ];

        let currentIdx = 0;

        function loadQuestion(idx) {
            const data = questions[idx];
            document.getElementById('q-counter').innerText = `Question ${idx + 1} of ${questions.length}`;
            document.getElementById('q-text').innerText = data.q;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            data.options.forEach((opt, i) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                label.innerHTML = `
                    <input type="radio" name="quiz_option" value="${i}" onchange="checkAnswer(${i})">
                    <span>${String.fromCharCode(65 + i)}. ${opt}</span>
                `;
                container.appendChild(label);
            });

            document.getElementById('status-msg').innerText = "Waiting for answer...";
            document.getElementById('status-msg').style.color = "#94a3b8";
        }

        function checkAnswer(selectedIdx) {
            const correct = questions[currentIdx].answer;
            const msg = document.getElementById('status-msg');
            if (selectedIdx === correct) {
                msg.innerText = "✔ Correct! Ready for next question.";
                msg.style.color = "#10b981";
            } else {
                msg.innerText = "✖ Incorrect option selected.";
                msg.style.color = "#ef4444";
            }
        }

        function nextQuestion() {
            currentIdx = (currentIdx + 1) % questions.length;
            loadQuestion(currentIdx);
        }

        loadQuestion(0);
    </script>
</body>
</html>
