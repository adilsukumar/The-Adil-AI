<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="t d">
<title id="t">The Adil AI - Universal MCQ Solver and Autopilot Suite</title>
<desc id="d">Sub-second Groq LPU reasoning and Gemini Multimodal Vision autopilot.</desc>
<style>
@keyframes visit{0%,100%{opacity:.35}40%,65%{opacity:1}}.visit{animation:visit 9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}
@keyframes vector{50%{transform:rotate(-9deg)}}
@keyframes float{50%{transform:translateY(-5px)}}
.pulse{animation:pulse 5s ease-in-out infinite}
.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}
.float{animation:float 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.visit,.node,.pulse,.vector,.float{animation:none!important}}
</style>
<rect width="100%" height="100%" fill="#0E1116"/>
<text x="32" y="53" font-family="Bahnschrift, Arial, sans-serif" font-size="21" fill="#BCFCF6" font-weight="600">THE ADIL AI / UNIVERSAL MCQ AUTOPILOT</text>
<text x="24" y="296" font-family="Bahnschrift, Arial, sans-serif" font-size="270" fill="#F8F8F3" font-weight="700" letter-spacing="-7">ADIL</text>
<text x="32" y="409" font-family="Bahnschrift, Arial, sans-serif" font-size="77" fill="#FF4081" font-weight="600">Sub-second reasoning.</text>
<text x="32" y="486" font-family="Bahnschrift, Arial, sans-serif" font-size="56" fill="#FF4081" font-weight="600">Multimodal vision.</text>
<text x="32" y="564" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400">The universal AI autopilot for academic</text>
<text x="32" y="598" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400">examinations, quizzes, and learning.</text>

<!-- Neural Network / Solver Pipeline Graphic -->
<g transform="translate(740, 540) scale(1.05)">
