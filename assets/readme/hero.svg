  <path d="M50 150L150 90" fill="none" stroke="#51435D" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 90L150 90" fill="none" stroke="#51435D" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 90L250 40" fill="none" stroke="#51435D" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 90L250 140" fill="none" stroke="#51435D" stroke-width="2" stroke-linecap="round"/>
  <path d="M250 40L330 90" fill="none" stroke="#51435D" stroke-width="2" stroke-linecap="round"/>
  <path d="M250 140L330 90" fill="none" stroke="#51435D" stroke-width="2" stroke-linecap="round"/>

  <g class="visit" style="animation-delay:-0s">
    <circle cx="50" cy="30" r="18" fill="#141320" stroke="#38BDF8" stroke-width="2"/>
    <text x="50" y="35" font-family="Bahnschrift, Arial, sans-serif" font-size="11" fill="#38BDF8" font-weight="700" text-anchor="middle">DOM</text>
  </g>
  <g class="visit" style="animation-delay:-1s">
    <circle cx="50" cy="90" r="18" fill="#141320" stroke="#A855F7" stroke-width="2"/>
    <text x="50" y="95" font-family="Bahnschrift, Arial, sans-serif" font-size="10" fill="#A855F7" font-weight="700" text-anchor="middle">OCR</text>
  </g>
  <g class="visit" style="animation-delay:-2s">
    <circle cx="50" cy="150" r="18" fill="#141320" stroke="#FF4081" stroke-width="2"/>
    <text x="50" y="155" font-family="Bahnschrift, Arial, sans-serif" font-size="10" fill="#FF4081" font-weight="700" text-anchor="middle">IMG</text>
  </g>
  <g class="visit" style="animation-delay:-3s">
    <circle cx="150" cy="90" r="24" fill="#141320" stroke="#F3D962" stroke-width="2.5"/>
    <text x="150" y="95" font-family="Bahnschrift, Arial, sans-serif" font-size="12" fill="#F3D962" font-weight="800" text-anchor="middle">LPU</text>
  </g>
  <g class="visit" style="animation-delay:-4s">
    <circle cx="250" cy="40" r="20" fill="#141320" stroke="#10B981" stroke-width="2"/>
    <text x="250" y="45" font-family="Bahnschrift, Arial, sans-serif" font-size="11" fill="#10B981" font-weight="700" text-anchor="middle">CoT</text>
  </g>
  <g class="visit" style="animation-delay:-5s">
    <circle cx="250" cy="140" r="20" fill="#141320" stroke="#BCFCF6" stroke-width="2"/>
    <text x="250" y="145" font-family="Bahnschrift, Arial, sans-serif" font-size="10" fill="#BCFCF6" font-weight="700" text-anchor="middle">VISN</text>
  </g>
  <g class="visit" style="animation-delay:-6s">
    <circle cx="330" cy="90" r="22" fill="#141320" stroke="#10B981" stroke-width="2.5"/>
