  </g>
  <text x="190" y="200" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" text-anchor="middle">DETECT / REASON / SOLVE</text>
</g>

<text x="32" y="942" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600">GROQ LPU / GEMINI VISION / TAMPERMONKEY / DESKTOP</text>
</svg>